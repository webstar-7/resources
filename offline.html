<!doctype html>
<html lang="en">
<head>

<title>NYANSATEK Resources</title>
<meta name="theme-color" content="#0b101b">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 20%, #1b2742 0%, #0b101b 65%); color: #e8ecf3;
    font: 15px/1.5 Inter, "Segoe UI", system-ui, sans-serif; text-align: center; }
  .c { max-width: 340px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 21px; margin: 16px 0 6px; }
  p { color: #98a3b8; margin: 0 0 20px; }
  button { min-height: 46px; padding: 0 24px; border: 0; border-radius: 11px; font: inherit; font-weight: 800; cursor: pointer;
    color: #1a1405; background: linear-gradient(135deg, #f2c14e, #d4a017); }
</style>
</head>
<body>
  <div class="c">
    <img src="assets/app/icon-192.png" alt="">
    <h1>You&rsquo;re offline</h1>
    <p>NYANSATEK Resources needs the internet to check your sign-in. Connect to Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
